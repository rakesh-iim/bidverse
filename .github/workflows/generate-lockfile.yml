name: Generate reviewed npm lockfile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-lockfile.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile and deterministic installation
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: bidverse-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Commit to a new review branch (never main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/lockfile-review-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm dependency lockfile"
          git push origin "$branch"
          echo "Review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          gh pr create --base main --head "$branch" --title "chore: review reproducible npm lockfile" --body "Generated on GitHub Actions using Node 22. Review dependency versions, npm ci and the required checks before merging. This PR does not approve production launch." || echo "::warning::GitHub Actions could not open a PR automatically; lockfile remains available in workflow artifacts."
          echo "Review dependency versions and CI checks before merging." >> "$GITHUB_STEP_SUMMARY"
